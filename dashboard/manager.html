<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#152e40"><title>DC NOW · 데이터센터 현황 관리</title><link rel="stylesheet" href="./manager.css"></head>
<body data-mode="public">
<header class="top"><a class="brand" href="#home"><span>DC</span><b>DC NOW</b><small>데이터센터 현황 관리</small></a><div class="topright"><a class="button" href="./">시장 대시보드</a><span id="modeLabel">공개 현황</span><button id="reload" class="button">새로고침</button></div></header>
<div class="shell"><aside class="sidebar"><nav aria-label="업무 메뉴"><small>담당 업무</small><button data-page="home" aria-current="page">오늘의 업무</button><small>센터·프로젝트</small><button data-page="register">센터 현황</button><button data-page="projects">개발 프로젝트</button><button data-page="map">지도·지역</button><button data-page="supply">공급 분석</button><button data-page="companies">사업자</button><small>조사·검토</small><button data-page="review">근거 검토</button><button data-page="sources">시장 근거</button><button data-page="ops">수집·발행</button></nav><div class="sidefoot"><span id="snapshotAt">데이터 불러오는 중</span><small>값의 갱신 시각과 근거 확인일을 구분합니다.</small></div></aside>
<main id="main"><section id="login" hidden><h1>담당자 작업공간 연결</h1><p>내부 관리 API에 연결하면 실제 검토 대기열과 승인·반려 업무를 처리할 수 있습니다.</p><form id="connectForm" class="auth"><label>관리 API 토큰<input id="token" type="password" autocomplete="off" required></label><label>검토자 이름<input id="reviewer" autocomplete="off" required></label><button class="button primary" type="submit">연결</button></form><p class="muted">토큰과 검토자 이름은 브라우저 저장소에 보관하지 않습니다.</p></section><div id="feedback" role="status" aria-live="polite"></div><div id="content"><div class="pagehead"><div><p class="overline">MANAGER WORKSPACE</p><h1>오늘의 업무</h1><p>센터 현황과 보완할 정보를 확인합니다.</p></div></div><div class="metrics"><article><span>전체 추적</span><strong id="initialTotal">0</strong></article><article><span>상용 확정</span><strong id="initialCommercial">0</strong></article><article><span>검토 후보</span><strong id="initialReview">0</strong></article><article><span>공개 근거</span><strong id="initialEvidence">0</strong></article></div><section class="panel"><header><h2>센터 현황</h2></header><div class="tablewrap"><table><thead><tr><th>센터</th><th>지역</th><th>단계</th><th>시설 범주</th></tr></thead><tbody id="initialRows"></tbody></table></div></section></div></main></div>
<dialog id="compareDialog"><form method="dialog"><button class="close" aria-label="비교 닫기">×</button></form><h2>센터 비교</h2><div id="compareContent" class="tablewrap"></div></dialog>
<noscript><p>센터 검색과 상세 탐색에는 JavaScript가 필요합니다.</p></noscript><script src="./manager-core.js"></script><script src="./manager.js"></script>
</body></html>

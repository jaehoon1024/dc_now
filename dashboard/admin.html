<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내부 검토 관리</title><style>body{font:14px system-ui;margin:0;background:#f2f5f8;color:#18304a}header{background:#172d49;color:white;padding:22px}main{max-width:1300px;margin:auto;padding:20px}.bar,section{background:white;border:1px solid #d7e0e9;border-radius:10px;padding:15px;margin-bottom:14px}button,input,select{padding:9px;border:1px solid #a9b7c5;border-radius:6px}button{background:#1769aa;color:white}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e1e7ed;text-align:left}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.error{color:#b3312d}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><header><h1>내부 검토 관리</h1><div>토큰은 브라우저 메모리에만 유지됩니다.</div></header><main><div class="bar"><input id="token" type="password" placeholder="관리 API 토큰" size="45"><button id="load">불러오기</button><span id="state"></span></div><div class="grid"><section><h2>검토 대기열</h2><div id="queue"></div></section><section><h2>품질 점검</h2><div id="quality"></div></section></div></main><script>const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path){const r=await fetch(path,{headers:{Authorization:'Bearer '+document.querySelector('#token').value}});if(!r.ok)throw Error(r.status);return r.json()}function table(rows){if(!rows.length)return '<p>대기 없음</p>';return '<table><tr><th>종류</th><th>건수</th></tr>'+rows.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td></tr>').join('')+'</table>'}document.querySelector('#load').onclick=async()=>{const s=document.querySelector('#state');try{const[q,v]=await Promise.all([api('/internal/v1/review-queue'),api('/internal/v1/quality')]);document.querySelector('#queue').innerHTML=table(Object.entries(q).map(([k,x])=>[k,x.length]));document.querySelector('#quality').innerHTML=table(Object.entries(v.checks).map(([k,x])=>[k,x.length]));s.textContent=' 정상';s.className=''}catch(e){s.textContent=' 인증 또는 연결 오류';s.className='error'}};</script></html>

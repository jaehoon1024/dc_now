<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>전국 데이터센터 현황</title><style>
:root{--navy:#10243e;--blue:#1769aa;--green:#16845b;--amber:#d98518;--line:#d8e2ec;--bg:#f3f6f9}*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:#17283b}header{background:var(--navy);color:white;padding:22px 28px}header h1{margin:0 0 5px;font-size:25px}main{max-width:1500px;margin:auto;padding:20px}.filters,.cards,.grid{display:grid;gap:14px}.filters{grid-template-columns:2fr 1fr 1fr auto;background:white;padding:14px;border:1px solid var(--line);border-radius:10px}.filters input,.filters select,.filters button{padding:10px;border:1px solid #aab9c8;border-radius:7px;background:white}.filters button{background:var(--blue);color:white;border:0}.cards{grid-template-columns:repeat(4,1fr);margin:14px 0}.card,section{background:white;border:1px solid var(--line);border-radius:10px;padding:16px}.card strong{display:block;font-size:25px;margin-top:7px}.grid{grid-template-columns:1.1fr 1.9fr}section h2{font-size:17px;margin:0 0 12px}.map{height:470px;background:linear-gradient(145deg,#eaf4f6,#dce9ef);position:relative;overflow:hidden;border-radius:8px}.korea{position:absolute;inset:7% 17%;background:#b8d4c8;clip-path:polygon(56% 0,75% 8%,73% 22%,85% 34%,75% 48%,81% 61%,66% 76%,56% 100%,39% 85%,31% 65%,18% 53%,27% 35%,33% 16%)}.marker{position:absolute;width:14px;height:14px;border:2px solid white;border-radius:50%;background:var(--amber);transform:translate(-50%,-50%);box-shadow:0 1px 4px #234;cursor:pointer}.marker.OPERATING{background:var(--green)}.marker.MIXED{background:#7655bd}.scroll{overflow:auto;max-height:470px}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:10px;border-bottom:1px solid #e5ebf0;text-align:left}th{position:sticky;top:0;background:#edf3f8}tbody tr{cursor:pointer}tbody tr:hover{background:#f0f7fc}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}.empty{color:#65788d;padding:30px;text-align:center}.status-SUCCESS{color:var(--green);font-weight:700}.status-FAILED,.status-PARTIAL{color:#b43a36;font-weight:700}dialog{border:0;border-radius:12px;max-width:650px;width:90%;box-shadow:0 20px 70px #1238}dialog::backdrop{background:#1238}@media(max-width:900px){.filters,.cards,.grid,.tabs{grid-template-columns:1fr}.map{height:350px}}
</style></head><body><header><h1>전국 데이터센터 현황</h1><div>공개 승인 데이터 · 운영/개발 현황</div></header><main>
<div class="filters"><input id="search" placeholder="센터명·주소 검색"><select id="sido"><option value="">전체 지역</option></select><select id="status"><option value="">전체 상태</option><option>OPERATING</option><option>DEVELOPMENT</option><option>MIXED</option><option>ON_HOLD</option><option>UNKNOWN</option></select><button id="reload">조회</button></div>
<div class="cards"><div class="card">공개 센터<strong id="total">0</strong></div><div class="card">운영<strong id="operating">0</strong></div><div class="card">개발<strong id="development">0</strong></div><div class="card">최근 갱신<strong id="updated">—</strong></div></div>
<div class="grid"><section><h2>전국 지도</h2><div id="map" class="map"><div class="korea"></div></div></section><section><h2>센터 목록</h2><div class="scroll"><table><thead><tr><th>센터</th><th>지역</th><th>상태</th><th>운영 IT MW</th><th>개발 IT MW</th></tr></thead><tbody id="sites"></tbody></table><div id="siteEmpty" class="empty">공개 승인 센터가 없습니다.</div></div></section></div>
<div class="tabs"><section><h2>지역 현황</h2><div id="regions"></div></section><section><h2>경쟁사 비교</h2><div id="companies"></div></section><section><h2>연도별 공급</h2><div id="yearly"></div></section><section><h2>수집 운영</h2><div id="collection"></div></section></div>
</main><dialog id="detail"><button onclick="detail.close()">닫기</button><div id="detailBody"></div></dialog><script>
const $=s=>document.querySelector(s), esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path){const r=await fetch(path);if(!r.ok)throw Error(r.status);return r.json()}
function miniTable(items,cols){if(!items.length)return '<div class="empty">데이터 없음</div>';return '<div class="scroll"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c[1])+'</th>').join('')+'</tr></thead><tbody>'+items.map(x=>'<tr>'+cols.map(c=>'<td>'+esc(x[c[0]])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
async function loadSites(){const p=new URLSearchParams({limit:500});if($('#sido').value)p.set('sido',$('#sido').value);if($('#status').value)p.set('status',$('#status').value);const d=await api('/api/v1/sites?'+p),q=$('#search').value.toLowerCase();const items=d.items.filter(x=>(x.site_name+' '+(x.address_standard||'')).toLowerCase().includes(q));$('#total').textContent=d.total;$('#operating').textContent=items.filter(x=>['OPERATING','MIXED'].includes(x.lifecycle_group)).length;$('#development').textContent=items.filter(x=>['DEVELOPMENT','MIXED'].includes(x.lifecycle_group)).length;$('#updated').textContent=items.map(x=>x.latest_data_update||'').sort().pop()?.slice(0,10)||'—';$('#siteEmpty').hidden=items.length;$('#sites').innerHTML=items.map(x=>`<tr data-code="${esc(x.site_code)}"><td>${esc(x.site_name)}</td><td>${esc(x.sido)} ${esc(x.sigungu)}</td><td>${esc(x.lifecycle_group)}</td><td>${esc(x.operating_it_load_mw)}</td><td>${esc(x.development_it_load_mw)}</td></tr>`).join('');document.querySelectorAll('#sites tr').forEach(r=>r.onclick=()=>showDetail(r.dataset.code));document.querySelectorAll('.marker').forEach(x=>x.remove());items.filter(x=>x.latitude!=null&&x.longitude!=null).forEach(x=>{const m=document.createElement('button');m.className='marker '+x.lifecycle_group;m.title=x.site_name;m.style.left=((x.longitude-124)/8*66+17)+'%';m.style.top=((39-x.latitude)/6*86+7)+'%';m.onclick=()=>showDetail(x.site_code);$('#map').append(m)})}
async function showDetail(code){const x=await api('/api/v1/sites/'+encodeURIComponent(code));$('#detailBody').innerHTML='<h2>'+esc(x.site_name)+'</h2><p>'+esc(x.address_standard)+'</p><p>상태: '+esc(x.lifecycle_group)+' · 소유: '+esc(x.owner_names)+' · 운영: '+esc(x.operator_names)+'</p><h3>프로젝트</h3>'+miniTable(x.projects,[['project_name','프로젝트'],['status_code','상태'],['rfs_date','가동일'],['planned_rfs_date','예정일']]);$('#detail').showModal()}
async function loadSummary(){const [r,c,y,o]=await Promise.all([api('/api/v1/regions'),api('/api/v1/companies'),api('/api/v1/yearly'),api('/api/v1/collection-status')]);$('#regions').innerHTML=miniTable(r.items,[['sido','지역'],['lifecycle_group','상태'],['site_count','센터']]);const select=$('#sido');[...new Set(r.items.map(x=>x.sido))].forEach(v=>select.insertAdjacentHTML('beforeend','<option>'+esc(v)+'</option>'));$('#companies').innerHTML=miniTable(c.items,[['company_name','기업'],['site_count','센터'],['operating_site_count','운영'],['development_site_count','개발']]);$('#yearly').innerHTML=miniTable(y.items,[['supply_year','연도'],['date_basis','기준'],['project_count','프로젝트']]);$('#collection').innerHTML=miniTable(o.items,[['job_name','작업'],['run_status','상태'],['finished_at','최근 종료'],['new_document_count','신규']])}
$('#reload').onclick=loadSites;$('#search').oninput=loadSites;loadSummary().then(loadSites).catch(()=>{$('#siteEmpty').textContent='데이터를 불러오지 못했습니다.'});
</script></body></html>

<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전국 데이터센터 현황</title><style>:root{--n:#10243e;--b:#1769aa;--g:#16845b;--a:#d98518}*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#17283b;font:14px system-ui}header{background:var(--n);color:#fff;padding:22px}main{max-width:1450px;margin:auto;padding:20px}.filters,.cards,.layout,.stats{display:grid;gap:14px}.filters{grid-template-columns:2fr 1fr 1fr;background:#fff;padding:14px;border-radius:10px}.cards{grid-template-columns:repeat(4,1fr);margin:14px 0}.card,section{background:#fff;border:1px solid #d7e1ea;border-radius:10px;padding:15px}.card strong{display:block;font-size:25px}.layout{grid-template-columns:1fr 2fr}.map{height:430px;background:#e4f0f2;position:relative;overflow:hidden}.land{position:absolute;inset:8% 18%;background:#b8d4c8;clip-path:polygon(56% 0,75% 8%,73% 22%,85% 34%,75% 48%,81% 61%,66% 76%,56% 100%,39% 85%,31% 65%,18% 53%,27% 35%,33% 16%)}.m{position:absolute;width:14px;height:14px;border:2px solid #fff;border-radius:50%;background:var(--a);transform:translate(-50%,-50%)}.m.OPERATING{background:var(--g)}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #e2e8ef;text-align:left}.scroll{overflow:auto;max-height:430px}.stats{grid-template-columns:repeat(4,1fr);margin-top:14px}.empty{padding:30px;text-align:center;color:#65788d}@media(max-width:900px){.filters,.cards,.layout,.stats{grid-template-columns:1fr}}</style><header><h1>전국 데이터센터 현황</h1><div id="generated">승인된 공개 데이터</div></header><main><div class="filters"><input id="q" placeholder="센터명·주소 검색"><select id="region"><option value="">전체 지역</option></select><select id="status"><option value="">전체 상태</option><option>OPERATING</option><option>DEVELOPMENT</option><option>MIXED</option><option>ON_HOLD</option></select></div><div class="cards"><div class="card">공개 센터<strong id="total">0</strong></div><div class="card">운영<strong id="op">0</strong></div><div class="card">개발<strong id="dev">0</strong></div><div class="card">신규 문서<strong id="docs">0</strong></div></div><div class="layout"><section><h2>전국 지도</h2><div class="map" id="map"><div class="land"></div></div></section><section><h2>센터 목록</h2><div class="scroll"><table><thead><tr><th>센터</th><th>지역</th><th>상태</th><th>운영 IT MW</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty">공개 승인 센터가 없습니다.</div></div></section></div><div class="stats"><section><h2>지역</h2><div id="regions"></div></section><section><h2>기업</h2><div id="companies"></div></section><section><h2>연도별 공급</h2><div id="yearly"></div></section><section><h2>수집 상태</h2><div id="collection"></div></section></div></main><script>const $=s=>document.querySelector(s),esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let D;function list(items,keys){return items.length?'<table>'+items.slice(0,20).map(x=>'<tr>'+keys.map(k=>'<td>'+esc(x[k])+'</td>').join('')+'</tr>').join('')+'</table>':'<p class="empty">데이터 없음</p>'}function draw(){const q=$('#q').value.toLowerCase(),r=$('#region').value,s=$('#status').value,a=D.sites.filter(x=>(!r||x.sido===r)&&(!s||x.lifecycle_group===s)&&(x.site_name+' '+(x.address_standard||'')).toLowerCase().includes(q));$('#total').textContent=a.length;$('#op').textContent=a.filter(x=>['OPERATING','MIXED'].includes(x.lifecycle_group)).length;$('#dev').textContent=a.filter(x=>['DEVELOPMENT','MIXED'].includes(x.lifecycle_group)).length;$('#rows').innerHTML=a.map(x=>'<tr><td>'+esc(x.site_name)+'</td><td>'+esc(x.sido)+' '+esc(x.sigungu)+'</td><td>'+esc(x.lifecycle_group)+'</td><td>'+esc(x.operating_it_load_mw)+'</td></tr>').join('');$('#empty').hidden=a.length;document.querySelectorAll('.m').forEach(x=>x.remove());a.filter(x=>x.latitude!=null&&x.longitude!=null).forEach(x=>{let m=document.createElement('i');m.className='m '+x.lifecycle_group;m.title=x.site_name;m.style.left=((x.longitude-124)/8*64+18)+'%';m.style.top=((39-x.latitude)/6*84+8)+'%';$('#map').append(m)})}fetch('./data.json').then(x=>x.json()).then(d=>{D=d;$('#generated').textContent='생성 '+d.generated_at;[...new Set(d.sites.map(x=>x.sido).filter(Boolean))].forEach(x=>$('#region').insertAdjacentHTML('beforeend','<option>'+esc(x)+'</option>'));$('#docs').textContent=d.collection_status.reduce((n,x)=>n+(x.new_document_count||0),0);$('#regions').innerHTML=list(d.regions,['sido','lifecycle_group','site_count']);$('#companies').innerHTML=list(d.companies,['company_name','site_count']);$('#yearly').innerHTML=list(d.yearly,['supply_year','project_count']);$('#collection').innerHTML=list(d.collection_status,['job_name','run_status']);draw()}).catch(()=>$('#empty').textContent='공개 데이터를 불러오지 못했습니다.');['q','region','status'].forEach(x=>$('#'+x).addEventListener('input',draw));</script></html>
